default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "svgo-icons"
name = "svgo (icons)"
language = "system"
entry = "www/node_modules/.bin/svgo --config www/svgo-icons.config.cjs"
files = "^www/src/assets/icons/.*\\.svg$"

[[repos.hooks]]
id = "svgo-svgs"
name = "svgo (svgs)"
language = "system"
entry = "www/node_modules/.bin/svgo --config www/svgo.config.cjs"
files = "^www/src/assets/svgs/.*\\.svg$"

[[repos.hooks]]
id = "prettier"
name = "prettier"
language = "system"
entry = "pnpm exec prettier --write --ignore-unknown"

[[repos.hooks]]
id = "eslint"
name = "eslint"
language = "system"
entry = "pnpm exec eslint --cache --cache-location .cache/eslint/ --no-warn-ignored"
files = "\\.([cm]?[jt]s|astro)$"

[[repos.hooks]]
id = "astro-check"
name = "astro check"
language = "system"
entry = "pnpm --filter www exec astro check"
files = "^www/"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
language = "system"
entry = "pnpm exec commitlint --edit"
stages = ["commit-msg"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2" # frozen: v1.30.1
hooks = [{ id = "zizmor" }]
